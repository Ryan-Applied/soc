services:
  # --- Infrastructure ---
  kafka:
    image: redpandadata/redpanda:latest
    command: >
      redpanda start
      --smp 1 --memory 512M --reserve-memory 0M
      --overprovisioned --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aluskort
      POSTGRES_USER: aluskort
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluskort"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/localdev
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "localdev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["python", "-m", "infra.scripts.apply_migrations"]
    environment:
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["services", "sentinel"]

  # --- ALUSKORT Services (shared Dockerfile, per-service command) ---
  entity-parser:
    build: .
    command: ["python", "-m", "entity_parser.service"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      HEALTH_PORT: "8082"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["services"]

  context-gateway:
    build: .
    command: ["uvicorn", "context_gateway.api:app", "--host", "0.0.0.0", "--port", "8030"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      PORT: "8030"
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["services"]

  llm-router:
    build: .
    command: ["uvicorn", "llm_router.api:app", "--host", "0.0.0.0", "--port", "8031"]
    environment:
      CONTEXT_GATEWAY_URL: http://context-gateway:8030
      PORT: "8031"
    ports:
      - "8031:8031"
    depends_on:
      - context-gateway
    profiles: ["services"]

  orchestrator:
    build: .
    command: ["python", "-m", "orchestrator.service"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
      CONTEXT_GATEWAY_URL: http://context-gateway:8030
      HEALTH_PORT: "8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      context-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["services"]

  ctem-normaliser:
    build: .
    command: ["python", "-m", "ctem_normaliser.service"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      HEALTH_PORT: "8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["services"]

  dashboard:
    build: .
    command: ["uvicorn", "services.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      REDIS_HOST: redis
      APP_ENV: production
      DASHBOARD_AUTH_MODE: entra
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      DASHBOARD_ENTRA_CLIENT_ID: ${DASHBOARD_ENTRA_CLIENT_ID:-}
      ENABLE_TEST_HARNESS: "false"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["services"]

  wiz-connector:
    build: .
    command: ["python", "-m", "wiz_connector.service"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      WIZ_CLIENT_ID: ${WIZ_CLIENT_ID:-}
      WIZ_CLIENT_SECRET: ${WIZ_CLIENT_SECRET:-}
      WIZ_API_ENDPOINT: ${WIZ_API_ENDPOINT:-https://api.us1.app.wiz.io/graphql}
      WIZ_POLL_INTERVAL_SECONDS: ${WIZ_POLL_INTERVAL_SECONDS:-300}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
    profiles: ["services"]

  sentinel-adapter:
    build: .
    command: ["uvicorn", "sentinel_adapter.service:app", "--host", "0.0.0.0", "--port", "8032"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      SENTINEL_WORKSPACE_ID: ${SENTINEL_WORKSPACE_ID:-}
      SENTINEL_CONNECTOR_ID: ${SENTINEL_CONNECTOR_ID:-sentinel-default}
      SENTINEL_POLL_INTERVAL_SECONDS: ${SENTINEL_POLL_INTERVAL_SECONDS:-30}
      SENTINEL_OVERLAP_SECONDS: ${SENTINEL_OVERLAP_SECONDS:-60}
      SENTINEL_SUBSCRIPTION_ID: ${SENTINEL_SUBSCRIPTION_ID:-}
      SENTINEL_RESOURCE_GROUP: ${SENTINEL_RESOURCE_GROUP:-}
      SENTINEL_WORKSPACE_NAME: ${SENTINEL_WORKSPACE_NAME:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      PORT: "8032"
    ports:
      - "8032:8032"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8032/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["sentinel"]

  sentinel-writeback:
    build: .
    command: ["uvicorn", "sentinel_adapter.writeback_service:app", "--host", "0.0.0.0", "--port", "8033"]
    environment:
      POSTGRES_DSN: postgresql://aluskort:localdev@postgres:5432/aluskort
      SENTINEL_WRITEBACK_POLL_SECONDS: ${SENTINEL_WRITEBACK_POLL_SECONDS:-10}
      SENTINEL_WRITEBACK_BATCH_SIZE: ${SENTINEL_WRITEBACK_BATCH_SIZE:-10}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      PORT: "8033"
    ports:
      - "8033:8033"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8033/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["sentinel"]

volumes:
  kafkadata:
  pgdata:
  redisdata:
  qdrantdata:
  neo4jdata:
  miniodata:
